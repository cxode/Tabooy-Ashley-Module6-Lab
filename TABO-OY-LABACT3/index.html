<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>IT Seminar Student Registration</h1>

    <form id="registrationForm" novalidate>
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          required
          aria-describedby="fullNameError"
        >
        <span class="error" id="fullNameError" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="studentNumber">Student number</label>
        <input
          type="text"
          id="studentNumber"
          name="studentNumber"
          required
          placeholder="24-1234-123"
          aria-describedby="studentNumberError"
        >
        <span class="error" id="studentNumberError" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          aria-describedby="emailError"
        >
        <span class="error" id="emailError" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="mobileNumber">Mobile number</label>
        <input
          type="tel"
          id="mobileNumber"
          name="mobileNumber"
          required
          placeholder="09171234567 or +639171234567"
          aria-describedby="mobileNumberError"
        >
        <span class="error" id="mobileNumberError" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          aria-describedby="passwordError passwordFeedback"
        >
        <span class="error" id="passwordError" role="alert"></span>
        <span class="feedback" id="passwordFeedback"></span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          required
          aria-describedby="confirmPasswordError"
        >
        <span class="error" id="confirmPasswordError" role="alert"></span>
      </div>

      <div class="form-group">
        <label for="course">Course</label>
        <select
          id="course"
          name="course"
          required
          aria-describedby="courseError"
        >
          <option value="" disabled selected>Select your course</option>
          <option value="BSIT">BSIT</option>
          <option value="BSCS">BSCS</option>
        </select>
        <span class="error" id="courseError" role="alert"></span>
      </div>

      <div class="form-group checkbox-group">
        <input
          type="checkbox"
          id="terms"
          name="terms"
          required
          aria-describedby="termsError"
        >
        <label for="terms">I agree to the terms and conditions.</label>
        <span class="error" id="termsError" role="alert"></span>
      </div>

      <div class="button-group">
        <button type="submit" id="registerBtn">Register</button>
        <button type="reset" id="resetBtn">Reset</button>
      </div>
    </form>

    <p id="successMessage" class="success" hidden></p>

    <section id="registrationSummary" hidden>
      <h2>Registration Summary</h2>
      <p>Full name: <span id="summaryName"></span></p>
      <p>Student number: <span id="summaryStudentNumber"></span></p>
      <p>Email address: <span id="summaryEmail"></span></p>
      <p>Mobile number: <span id="summaryMobileNumber"></span></p>
      <p>Course: <span id="summaryCourse"></span></p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
